name: Construir Aplicativo MOZWORK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Gerar MOZWORK APK Oficial
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar Android SDK 36
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependências
        run: npm ci

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Preparar assinatura digital
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/mozwork-release.jks
          test -s android/app/mozwork-release.jks

      - name: Diagnosticar assinatura
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "===== VERIFICAR KEYSTORE ====="
          test -s android/app/mozwork-release.jks && echo "KEYSTORE: OK" || { echo "KEYSTORE: FALTA"; exit 1; }
          echo "===== VERIFICAR VARIAVEIS ====="
          test -n "$KEYSTORE_PASSWORD" && echo "PASSWORD: OK" || { echo "PASSWORD: FALTA"; exit 1; }
          test -n "$KEY_ALIAS" && echo "ALIAS: OK" || { echo "ALIAS: FALTA"; exit 1; }
          test -n "$KEY_PASSWORD" && echo "KEY PASSWORD: OK" || { echo "KEY PASSWORD: FALTA"; exit 1; }

      - name: Compilar APK oficial assinado
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android assembleRelease bundleRelease

      - name: Verificar assinatura e preparar APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          test -s "$APK" || {
            echo "ERRO: APK release não encontrado."
            exit 1
          }

          "$SIGNER" verify --verbose --print-certs "$APK"

          cp "$APK" MOZWORK-OFICIAL.apk
          test -s MOZWORK-OFICIAL.apk

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          test -s "$AAB" || {
            echo "ERRO: AAB não encontrado."
            exit 1
          }

          jarsigner -verify -verbose -certs "$AAB"

          cp "$AAB" MOZWORK-OFICIAL.aab
          test -s MOZWORK-OFICIAL.aab

          echo "APK e AAB oficiais assinados e verificados com sucesso."

      - name: Disponibilizar APK e AAB oficiais
        uses: actions/upload-artifact@v4
        with:
          name: MOZWORK-PACOTE-OFICIAL
          path: |
            MOZWORK-OFICIAL.apk
            MOZWORK-OFICIAL.aab
          retention-days: 30
