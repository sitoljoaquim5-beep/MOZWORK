name: Construir Aplicativo MOZWORK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Gerar MOZWORK APK Oficial
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar Android SDK 36
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependências
        run: npm ci

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Preparar assinatura digital
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/mozwork-release.jks
          test -s android/app/mozwork-release.jks

      - name: Compilar APK oficial assinado
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android assembleRelease

      - name: Preparar APK
        run: |
          echo "===== PROCURAR APK GERADO ====="
          find android/app/build/outputs/apk -type f -name "*.apk" -print
          APK=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERRO: Nenhum APK foi gerado."
            exit 1
          fi
          cp "$APK" MOZWORK-OFICIAL.apk
          echo "APK preparado: $APK"

      - name: Disponibilizar APK oficial
        uses: actions/upload-artifact@v4
        with:
          name: MOZWORK-APK-OFICIAL
          path: MOZWORK-OFICIAL.apk
          retention-days: 30
