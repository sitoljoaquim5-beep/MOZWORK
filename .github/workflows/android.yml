name: Construir Aplicativo MOZWORK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Gerar MOZWORK APK
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceitar licenças Android SDK
        run: yes | sdkmanager --licenses

      - name: Instalar Android SDK 36
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependências
        run: npm ci

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar APK
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android assembleDebug

      - name: Preparar APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MOZWORK.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MOZWORK-APK
          path: MOZWORK.apk
          retention-days: 30
